services:
  tfg-mongo:
    image: mongo:7
    container_name: tfg-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - tfg-net

  tfg-api:
    build:
      context: ./API
      dockerfile: Dockerfile
    container_name: tfg-api
    environment:
      PORT: ${PORT}
      MONGO_URI: "mongodb://${MONGO_USER}:${MONGO_PASSWORD}@tfg-mongo:27017"
      DATABASE_NAME: ${MONGO_DB}
      JWT_SECRET: ${JWT_SECRET}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASS: ${EMAIL_PASS}
      SITE_NAME: ${SITE_NAME}
    ports:
      - "3000:3000"
    volumes:
      - ./API/uploads:/app/uploads
    depends_on:
      - tfg-mongo
    networks:
      - tfg-net

  tfg-web:
    build:
      context: ./WEB
      dockerfile: Dockerfile
    container_name: tfg-web
    ports:
      - "4200:4200"
    environment:
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING}
      CHOKIDAR_INTERVAL: ${CHOKIDAR_INTERVAL}
    volumes:
      - ./WEB:/app
      - /app/node_modules
    command: npx ng serve --host 0.0.0.0 --port 4200 --poll 2000
    depends_on:
      - tfg-api
    networks:
      - tfg-net

volumes:
  mongo_data:

networks:
  tfg-net:
    driver: bridge
