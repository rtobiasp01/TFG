
<section class="media-page">
    <header class="media-header">
        <h2>Galeria de media</h2>
        <p>Total de archivos: {{ archivos().length }}</p>
    </header>

    @if (archivos().length === 0) {
        <div class="empty-state">
            <p>No hay imagenes subidas todavia.</p>
        </div>
    } @else {
        <div class="media-grid">
            @for (media of archivos(); track media) {
                <article class="media-card">
                    <button type="button" class="media-preview" (click)="openImageModal(media)">
                        @if (isVideoFile(media)) {
                            <video [src]="getImageUrl(media)" muted></video>
                            <span class="video-badge">▶</span>
                        } @else {
                            <img [src]="getImageUrl(media)" [alt]="media" loading="lazy" />
                        }
                    </button>

                    <button
                        type="button"
                        class="delete-btn"
                        (click)="$event.stopPropagation(); eliminarArchivo(media)"
                        aria-label="Eliminar archivo"
                        title="Eliminar"
                    >
                        Eliminar
                    </button>
                </article>
            }
        </div>
    }
</section>

@if (showImageModal()) {
    <div class="image-modal-backdrop" (click)="closeImageModal()">
        <div class="image-modal" (click)="$event.stopPropagation()">
            <button
                type="button"
                class="modal-close"
                (click)="closeImageModal()"
                aria-label="Cerrar"
            >
                ×
            </button>
            @if (isVideoFile(selectedImage())) {
                <video [src]="selectedImage()" controls autoplay playsinline></video>
            } @else {
                <img [src]="selectedImage()" alt="Vista ampliada" />
            }
        </div>
    </div>
}
