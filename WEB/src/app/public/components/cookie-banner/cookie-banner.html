@if (isVisible()) {
  <div class="cookie-banner">
    <div class="cookie-banner__content">
      <p class="cookie-banner__text">
        Utilizamos cookies propias y de terceros para mejorar tu experiencia, analizar el tráfico y personalizar contenido.
        <a routerLink="/politica-cookies" class="cookie-banner__link">Más información</a>
      </p>
    </div>
    <div class="cookie-banner__actions">
      <button type="button" class="cookie-banner__btn cookie-banner__btn--secondary" (click)="rejectNonEssential()">
        Solo necesarias
      </button>
      <button type="button" class="cookie-banner__btn cookie-banner__btn--primary" (click)="acceptAll()">
        Aceptar todas
      </button>
    </div>
  </div>
}
