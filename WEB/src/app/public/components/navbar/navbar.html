<div>
  <nav class="navbar">
    <a routerLink="/inicio" class="logo">{{ siteName() }}</a>
    <ul class="nav-links">
      <li><a routerLink="/inicio" routerLinkActive="active-link">Home</a></li>
      <li>
        <a routerLink="/cart" routerLinkActive="active-link">Carrito ({{ cartItemCount() }})</a>
      </li>

      @if (isAuthenticated()) {
        <li><a routerLink="/pedidos" routerLinkActive="active-link">Mis Pedidos</a></li>
      }

      @if (!isAuthenticated()) {
        <li><a routerLink="/login" routerLinkActive="active-link">Iniciar sesión</a></li>
        <li><a routerLink="/register" routerLinkActive="active-link">Registrarse</a></li>
      } @else {
        @if (isAdmin()) {
          <li>
            <a routerLink="/admin/home" routerLinkActive="active-link" class="admin-link">
              Panel de admin
            </a>
          </li>
        }
        <li class="user-email">{{ currentUser()?.email }}</li>
        <li>
          <button type="button" class="logout-button" (click)="logout()">Cerrar sesión</button>
        </li>
      }
    </ul>
  </nav>
</div>
