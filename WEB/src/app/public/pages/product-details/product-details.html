<div class="main-content">
  <div class="product-info">
    <div class="product-images">
      <div class="img-principal">
        <img src="{{ imagenPrincipal() }}" alt="" />
      </div>
      <div class="gallery">
        @for (img of galeriaActual(); track $index) {
          <img src="{{ img }}" alt="" (click)="changeImage(img)" />
        }
      </div>
    </div>
    <div class="product-variables">
      <p>{{ product()?.title }}</p>
      <p>{{ product()?.short_description }}</p>
      <p>Stock:</p>
      <p>{{ product()?.price }}</p>
      <div class="variant-list">
        @for (variant of variantesProducto(); track $index) {
          <div class="variant-item">
            @for (item of variant | keyvalue; track item.key) {
              <p>{{ item.key }}: {{ item.value }}</p>
            }
          </div>
        }
      </div>
      <button class="btn-cart">Añadir carrito</button>
      <div class="product-description"></div>
    </div>
  </div>
  <div class="other-content"></div>
</div>
